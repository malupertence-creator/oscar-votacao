<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel: Mais Criativo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<main class="painel" id="entrada-box">
  <p class="selo">Painel da votação</p>
  <h1>Entrar</h1>
  <form id="entrada" style="display:grid;gap:12px;max-width:420px">
    <input id="senha" type="password" placeholder="Senha do painel" aria-label="Senha do painel" autocomplete="off">
    <button class="botao" type="submit">Entrar</button>
    <p class="erro" id="erro-senha" aria-live="polite"></p>
  </form>
</main>
<main class="painel" id="app" hidden>
  <h1 class="faixa">Mais Criativo</h1>
  <div class="palco" id="palco">
    <div id="qr" aria-label="QR Code da votação"></div>
    <div class="lado">
      <img class="capa" src="capa.jpg" alt="Oscar da Física 2026">
      <h2 id="status">Votação fechada</h2>
      <div class="total" id="total">0</div>
      <p class="apoio">votos</p>
      <p class="endereco" id="endereco"></p>
    </div>
  </div>
  <div id="resultado" hidden></div>
  <div class="acoes">
    <button class="botao" id="alternar">Abrir votação</button>
    <button class="botao neutro" id="revelar">Mostrar resultado</button>
    <button class="botao neutro" id="zerar">Zerar votos de teste</button>
  </div>
  <p class="apoio" id="msg" aria-live="polite"></p>
</main>
<script src="config.js"></script>
<script src="qrcode.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var senha = "", aberta = false, confirmando = false, timer = null;
  var link = new URL("./", location.href).href;

  function desenharQR() {
    var q = qrcode(0, "M"); q.addData(link); q.make();
    var img = document.createElement("img");
    img.src = q.createDataURL(12, 0); img.alt = "QR Code para votar";
    $("qr").textContent = ""; $("qr").append(img);
    $("endereco").textContent = link;
  }
  function resultado(lista, total) {
    var box = $("resultado"); box.textContent = "";
    lista.forEach(function (c) {
      var l = document.createElement("div"); l.className = "linha";
      var r = document.createElement("div"); r.className = "rotulo";
      var n = document.createElement("span"), v = document.createElement("span");
      n.textContent = c.nome + (c.grupo ? " · " + c.grupo : "");
      v.textContent = c.votos + (total ? " (" + Math.round(100 * c.votos / total) + "%)" : "");
      r.append(n, v);
      var t = document.createElement("div"); t.className = "trilha";
      var b = document.createElement("div"); b.className = "barra";
      b.style.width = (lista[0].votos ? 100 * c.votos / lista[0].votos : 0) + "%";
      t.append(b); l.append(r, t); box.append(l);
    });
  }
  async function atualizar() {
    try {
      var d = await chamar("painel", { p_senha: senha });
      if (d.erro) return false;
      aberta = d.aberta;
      $("status").textContent = aberta ? "Votação aberta" : "Votação fechada";
      $("alternar").textContent = aberta ? "Fechar votação" : "Abrir votação";
      $("total").textContent = d.total;
      resultado(d.resultados, d.total);
      $("msg").textContent = "";
      return true;
    } catch (e) {
      $("msg").textContent = "Sem conexão com a votação. Tentando de novo…";
      return true;
    }
  }
  $("entrada").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    senha = $("senha").value.trim();
    try {
      var d = await chamar("painel", { p_senha: senha });
      if (d.erro) { $("erro-senha").textContent = "Senha incorreta."; return; }
    } catch (e) { $("erro-senha").textContent = "Sem conexão. Confira a internet e o config.js."; return; }
    $("entrada-box").hidden = true; $("app").hidden = false;
    desenharQR(); await atualizar();
    timer = setInterval(atualizar, 3000);
  });
  $("alternar").addEventListener("click", async function () {
    $("alternar").disabled = true;
    try { await chamar("mudar_votacao", { p_senha: senha, p_aberta: !aberta }); await atualizar(); }
    catch (e) { $("msg").textContent = "Não consegui mudar a votação. Tente de novo."; }
    $("alternar").disabled = false;
  });
  $("revelar").addEventListener("click", function () {
    var r = $("resultado"), v = r.hidden;
    r.hidden = !v; $("palco").hidden = v;
    $("revelar").textContent = v ? "Mostrar QR Code" : "Mostrar resultado";
  });
  $("zerar").addEventListener("click", async function () {
    if (!confirmando) {
      confirmando = true;
      $("zerar").textContent = "Toque de novo para apagar tudo";
      setTimeout(function () { confirmando = false; $("zerar").textContent = "Zerar votos de teste"; }, 5000);
      return;
    }
    confirmando = false; $("zerar").textContent = "Zerar votos de teste";
    try { await chamar("zerar", { p_senha: senha }); await atualizar(); }
    catch (e) { $("msg").textContent = "Não consegui zerar. Tente de novo."; }
  });
})();
</script>
</body>
</html>
